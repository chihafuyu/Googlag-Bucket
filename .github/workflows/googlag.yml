name: Googlag Scraper

on:
  workflow_dispatch:

concurrency:
  group: googlag-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Fetch Precompiled Apkeep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          
          APKEEP_VERSION='1.0.0'
          APKEEP_ASSET='apkeep-x86_64-unknown-linux-gnu'
          APKEEP_URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/${APKEEP_ASSET}"

          wget -q --show-progress --https-only "$APKEEP_URL" -O apkeep

          EXPECTED_SHA256="$(
            gh api "repos/EFForg/apkeep/releases/tags/${APKEEP_VERSION}" \
              --jq '.assets[] | select(.name == "'"$APKEEP_ASSET"'") | .digest' \
              | sed 's/^sha256://'
          )"

          if [ -z "$EXPECTED_SHA256" ] || ! printf '%s  %s\n' "$EXPECTED_SHA256" apkeep | sha256sum --check --status; then
            echo "::error::apkeep SHA-256 verification failed"
            rm -f apkeep
            exit 1
          fi

          chmod 0755 apkeep
          sudo install -m 0755 apkeep /usr/local/bin/apkeep
          rm -f apkeep

      - name: Prepare Output Directory
        run: |
          rm -rf Release_Output
          mkdir -p Release_Output

      - name: Execute Downloader
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          PLAY_AAS_TOKEN: ${{ secrets.PLAY_AAS_TOKEN }}
          DEVICE_B64: ${{ secrets.DEVICE_B64 }}
        run: python main.py

      - name: Validate Output & Generate Checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          
          if ! find Release_Output -type f -print -quit | grep -q .; then
            echo "::error::Release_Output is empty. No APK downloaded."
            exit 1
          fi
          
          (
            cd Release_Output
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > Release_Output/SHA256SUMS

      - name: Generate Unique Release Tag
        id: tag_gen
        run: |
          echo "TAG_NAME=build-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "Googlag Artifacts - ${{ steps.tag_gen.outputs.TAG_NAME }}"
          files: Release_Output/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
